server {
    listen 80;

    # The web page
    location / {
        proxy_pass http://frontend:8080;
    }

    # /api/items/xyz  ->  items-api /xyz   (trailing slash strips the prefix)
    location /api/items/ {
        proxy_pass http://items-api:5000/;
    }

    # /api/borrows/xyz  ->  borrow-api /xyz
    location /api/borrows/ {
        proxy_pass http://borrow-api:5000/;
    }
}
